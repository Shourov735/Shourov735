<svg width="100%" height="100%" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="wave3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>

    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" />
      <circle cx="0" cy="0" r="1" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 58px;
      letter-spacing: -0.5px;
      fill: url(#title-grad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 21px;
      letter-spacing: 0.5px;
      fill: url(#sub-grad);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #e0e7ff;
    }
    .accent-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" />
  
  <!-- Subtle Tech Grid Overlay -->
  <rect width="1200" height="300" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  <circle cx="1000" cy="180" r="160" fill="#06b6d4" opacity="0.14" filter="url(#glow)" />

  <!-- Wave Layer 1 (Deep) -->
  <path d="M0 210 C 250 170, 450 250, 700 200 C 920 160, 1080 220, 1200 190 L 1200 300 L 0 300 Z" fill="url(#wave1)" />

  <!-- Wave Layer 2 (Middle) -->
  <path d="M0 230 C 200 270, 480 190, 750 240 C 960 270, 1100 210, 1200 225 L 1200 300 L 0 300 Z" fill="url(#wave2)" />

  <!-- Wave Layer 3 (Foreground Accent) -->
  <path d="M0 255 C 320 220, 600 280, 880 245 C 1020 230, 1120 260, 1200 250 L 1200 300 L 0 300 Z" fill="url(#wave3)" />

  <!-- Decorative Corner Accents -->
  <g opacity="0.4">
    <circle cx="50" cy="45" r="3" fill="#6366f1" />
    <circle cx="65" cy="45" r="3" fill="#8b5cf6" />
    <circle cx="80" cy="45" r="3" fill="#38bdf8" />
  </g>

  <!-- Content Group -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Main Name -->
    <text x="600" y="105" class="title">Md. Shourov</text>

    <!-- Subtitle / Academic Affiliation -->
    <text x="600" y="148" class="subtitle">Software Engineering Student @ IIT, University of Dhaka</text>

    <!-- Skills & Highlights Badges -->
    <g transform="translate(600, 195)">
      <!-- Badge 1: Full-Stack Web -->
      <g transform="translate(-315, 0)">
        <rect x="0" y="0" width="145" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="14" cy="14" r="4" fill="#6366f1" />
        <text x="78" y="19" text-anchor="middle" class="badge-text">Full-Stack Web</text>
      </g>

      <!-- Badge 2: Mobile Solutions -->
      <g transform="translate(-155, 0)">
        <rect x="0" y="0" width="140" height="28" rx="14" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="14" cy="14" r="4" fill="#38bdf8" />
        <text x="76" y="19" text-anchor="middle" class="badge-text">Mobile Solutions</text>
      </g>

      <!-- Badge 3: IT Secretary @ Nabodigonto -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="170" height="28" rx="14" fill="#31104b" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="14" cy="14" r="4" fill="#c084fc" />
        <text x="91" y="19" text-anchor="middle" class="badge-text">IT Sec @ Nabodigonto</text>
      </g>

      <!-- Badge 4: Open Source -->
      <g transform="translate(185, 0)">
        <rect x="0" y="0" width="130" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="14" cy="14" r="4" fill="#34d399" />
        <text x="71" y="19" text-anchor="middle" class="badge-text">Open Source</text>
      </g>
    </g>
  </g>
</svg>
